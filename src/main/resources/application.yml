spring:
  application:
    name: seat-reservation
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/seats
    username: seats
    password: seats-dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
  jackson:
    property-naming-strategy: SNAKE_CASE

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: prometheus
      base-path: /
      path-mapping:
        prometheus: metrics

app:
  jwt:
    secret: ${JWT_SECRET:zr3F+mYph87cxUJ/V/hovtwqHJ5HUguwLN8n7pP6AME=}
    expiry-hours: 24
  admin-secret: ${ADMIN_SECRET:dev-admin-secret}
  hold-ttl-minutes: 5

logging:
  level:
    org.hibernate.SQL: DEBUG
